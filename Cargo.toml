[workspace]
resolver = "2"
members = [
    "crates/bridge-types",
    "crates/bridge-platform",
    "crates/bridge-core",
    "crates/bridge-adapters",
    "crates/bridge-cli",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.8", features = ["derive", "env"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
hex = "0.4.3"
hmac = "0.12.1"
quick-xml = "0.37"
rand = "0.8.5"
regex = "1.11"
rmcp = { version = "3.11.0", features = ["server", "transport-io"] }
rusqlite = { version = "0.43.0", features = ["bundled", "backup"] }
schemars = { version = "1.2.3", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
similar = "2.7"
tempfile = "3.15"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "set-header", "trace"] }
tracing = "0.1.44"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_StationsAndDesktops",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
